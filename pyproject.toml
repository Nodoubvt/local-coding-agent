[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qai-cli"
version = "0.1.0"
description = "Offline terminal coding agent. Runs Qwen2.5-Coder 1.5B locally via llama.cpp - no API key, no cloud, no telemetry."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nodoubvt" }]
requires-python = ">=3.10"
keywords = [
  "llm",
  "cli",
  "agent",
  "coding-agent",
  "llama.cpp",
  "llama-cpp",
  "gguf",
  "qwen",
  "local-llm",
  "offline",
  "privacy",
  "coding-assistant",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "prompt-toolkit>=3.0.43",
  "platformdirs>=4.2",
  "huggingface-hub>=0.23",
  "pathspec>=0.12",
]

[project.optional-dependencies]
local = ["llama-cpp-python>=0.3.2"]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
  "mypy>=1.11",
  "build>=1.2",
  "twine>=5.1",
]

[project.scripts]
qai = "qai.cli:run"

[project.urls]
Homepage = "https://github.com/Nodoubvt/local-coding-agent"
Repository = "https://github.com/Nodoubvt/local-coding-agent"
Issues = "https://github.com/Nodoubvt/local-coding-agent/issues"
Changelog = "https://github.com/Nodoubvt/local-coding-agent/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/qai"]

[tool.hatch.build.targets.sdist]
include = ["src/qai", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
